    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var saved = null;
        try { saved = localStorage.getItem('ql_theme'); } catch(e) {}
        var theme = params.get('theme') || saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <script>
      function applyTheme(theme) {
        var isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.classList.toggle('light', !isDark);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        var bg = isDark ? '#0B0F19' : '#fafafa';
        if (document.body) document.body.style.background = bg;
        var placeholder = document.getElementById('suspense-fallback');
        if (placeholder) placeholder.style.background = bg;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', bg);
      }

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'THEME_CHANGE') {
          applyTheme(e.data.theme);
        }
      });

      window.addEventListener('storage', function(e) {
        if (e.key === 'ql_theme' && e.newValue) {
          applyTheme(e.newValue);
        }
      });

      // Keep scroll self-contained to iframe reading area; never scroll parent window
      window.addEventListener('load', function() {
        window.scrollTo(0, 0);
      });
      Element.prototype.scrollIntoView = function(opts) {
        var main = document.querySelector('.qa-main');
        if (main) {
          main.scrollTo({ top: 0, behavior: 'instant' });
        }
      };
    </script>
